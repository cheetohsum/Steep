name: Windows Build
on:
  push:
    branches:
      - dev
      - releases
      - 'release-[0-9]+.*'
    tags:
      - '[0-9]+.*'
  pull_request:
    branches:
      - dev
      - releases
      - 'release-[0-9]+.*'
  workflow_dispatch:

env:
  publish_pre_dev_labels: '[]'


jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
        arch: [x86_64, arm64]
    env:
      MSYS2_ENV_NAME: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'MINGW64' }}
      MSYS2_ENV_PREFIX: ${{ matrix.arch == 'arm64' && 'clangarm64' || 'mingw64' }}
    outputs:
      ARTIFACT_NAME_PREFIX: ${{ steps.prepare-artifact-name.outputs.ARTIFACT_NAME_PREFIX }}
      REF_NAME_FILTERED: ${{ steps.prepare-artifact-name.outputs.REF_NAME_FILTERED }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          location: C:\msys2
          update: true
          msystem: ${{env.MSYS2_ENV_NAME}}
          install: |
            git
            intltool
            unzip
          pacboy: |
            cc:p
            pkgconf:p
            cmake:p
            autotools:p
            ninja:p
            gtkmm3:p
            lcms2:p
            fftw:p
            lensfun:p
            libiptcdata:p
            libjxl:p
            exiv2:p
            ${{matrix.arch == 'x86_64' && '' || 'meson:p'}}

      - name: Install SIMDe
        if: ${{matrix.arch != 'x86_64'}}
        run: |
          echo "Cloning SIMDe source."
          git clone --depth 1 --branch 'v0.8.2' 'https://github.com/simd-everywhere/simde.git'
          echo "Setting up build directory."
          cd simde
          meson setup build
          echo "Configuring build."
          cd build
          meson configure -D tests=False
          echo "Building SIMDe."
          meson compile
          echo "Installing SIMDe."
          meson install

      - name: Install ONNX Runtime
        run: |
          ONNX_VERSION="1.17.1"
          if [ "${{matrix.arch}}" == "arm64" ]; then
            ONNX_ARCHIVE="onnxruntime-win-arm64-${ONNX_VERSION}.zip"
          else
            ONNX_ARCHIVE="onnxruntime-win-x64-${ONNX_VERSION}.zip"
          fi
          echo "Downloading ONNX Runtime ${ONNX_VERSION} for ${{matrix.arch}}."
          curl -L -o onnxruntime.zip \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VERSION}/${ONNX_ARCHIVE}"
          echo "Extracting ONNX Runtime."
          unzip -q onnxruntime.zip
          ONNX_DIR="$(pwd)/$(ls -d onnxruntime-win-*)"
          echo "ONNX Runtime extracted to ${ONNX_DIR}"

          echo "Patching ONNX Runtime header for MinGW compatibility."
          # ONNX uses _stdcall (MSVC keyword); GCC only recognizes __stdcall.
          # Replace _stdcall with nothing (safe on x64/ARM64).
          sed -i 's/#define ORT_API_CALL _stdcall/#define ORT_API_CALL/' \
            "${ONNX_DIR}/include/onnxruntime_c_api.h"
          # Also handle __stdcall variant just in case.
          sed -i 's/#define ORT_API_CALL __stdcall/#define ORT_API_CALL/' \
            "${ONNX_DIR}/include/onnxruntime_c_api.h"

          echo "Generating MinGW-compatible import library."
          cd "${ONNX_DIR}/lib"
          gendef onnxruntime.dll 2>/dev/null || true
          if [ -f onnxruntime.def ]; then
            dlltool -d onnxruntime.def -l libonnxruntime.dll.a -D onnxruntime.dll
            echo "MinGW import library created."
          else
            echo "gendef not available or failed; will link against .lib directly."
          fi
          cd -

          echo "ONNX_DIR=${ONNX_DIR}" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Configure build
        run: |
          export REF_NAME_FILTERED="$(echo '${{github.ref_name}}' | sed 's/[^A-z0-9_.-]//g')"

          if [ '${{github.ref_type}}' == 'tag' ]; then
            export CACHE_SUFFIX=""
          else
            echo "Setting cache suffix."
            export CACHE_SUFFIX="5-$REF_NAME_FILTERED"
            echo "Cache suffix is '$CACHE_SUFFIX'."
          fi

          echo "Running CMake configure."
          cmake \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE='${{matrix.build_type}}' \
            -DCACHE_NAME_SUFFIX="$CACHE_SUFFIX" \
            -DPROC_TARGET_NUMBER="1" \
            -DLENSFUNDBDIR="share/lensfun" \
            -DWITH_SIMDE="${{matrix.arch == 'x86_64' && 'OFF' || 'ON'}}" \
            -DWITH_AI_MASKING=ON \
            -DONNXRuntime_ROOT="${ONNX_DIR}" \
            -S . -B build

          echo "Recording filtered ref name."
          echo "REF_NAME_FILTERED=$REF_NAME_FILTERED" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Build Steep
        run: |
          echo "Running CMake install."
          cmake --build build --target install

      - name: Include Lensfun
        run: |
          echo "Updating Lensfun database."
          PYTHONPATH=/${{env.MSYS2_ENV_PREFIX}}/lib/site-packages lensfun-update-data  # Workaround for lensfun path mismatch
          echo "Creating Lensfun directory in the build directory."
          mkdir -p 'build/${{matrix.build_type}}/share'
          echo "Copying Lensfun database to the build directory."
          cp -R "/C/msys2/msys64/${{env.MSYS2_ENV_PREFIX}}/var/lib/lensfun-updates/version_1" 'build/${{matrix.build_type}}/share/lensfun'

      - name: Bundle dependencies
        run: |
          echo "Listing shared library dependencies."
          ldd "./build/${{matrix.build_type}}/rawtherapee.exe"
          echo "Finding DLLs to include."
          DLLS=($(ldd "./build/${{matrix.build_type}}/rawtherapee.exe" | grep "/${{env.MSYS2_ENV_PREFIX}}/bin/" | awk '{print($1)'}))
          echo "Required DLLs are: ${DLLS[*]}"

          echo "Getting workspace path."
          export BUILD_DIR="$(pwd)/build/${{matrix.build_type}}"
          echo "Build directory is '$BUILD_DIR'."
          echo "Changing working directory to MSYS2 ${{env.MSYS2_ENV_NAME}}."
          cd "/C/msys2/msys64/${{env.MSYS2_ENV_PREFIX}}"
          echo "Copying DLLs and EXEs."

          cd ./bin
          cp \
            "gdbus.exe" \
            "gspawn-win64-helper.exe" \
            "gspawn-win64-helper-console.exe" \
            ${DLLS[*]} \
            "$BUILD_DIR"
          cd -

          echo "Copying Adwaita theme."
          mkdir -p "$BUILD_DIR/share/icons/Adwaita"
          cd 'share/icons/Adwaita/'
          mkdir -p "$BUILD_DIR/share/icons/Adwaita/symbolic"
          cp -r \
            "symbolic/actions" \
            "symbolic/devices" \
            "symbolic/mimetypes" \
            "symbolic/places" \
            "symbolic/status" \
            "symbolic/ui" \
            "$BUILD_DIR/share/icons/Adwaita/symbolic"
          cp 'index.theme' "$BUILD_DIR/share/icons/Adwaita"
          cd -

          echo "Copying GDK pixbuf."
          mkdir -p "$BUILD_DIR/lib"
          cp -r 'lib/gdk-pixbuf-2.0' "$BUILD_DIR/lib/gdk-pixbuf-2.0"

          echo "Copying GLib schemas."
          mkdir -p "$BUILD_DIR/share/glib-2.0/schemas"
          cp 'share/glib-2.0/schemas/gschemas.compiled' "$BUILD_DIR/share/glib-2.0/schemas"

          echo "Copying ONNX Runtime DLL."
          if [ -f "${ONNX_DIR}/lib/onnxruntime.dll" ]; then
            cp "${ONNX_DIR}/lib/onnxruntime.dll" "$BUILD_DIR"
          fi

          echo "Bundling embedded Python with RawRefinery."
          PYTHON_VERSION="3.11.9"
          PYTHON_DIR="$BUILD_DIR/python"
          mkdir -p "$PYTHON_DIR"
          curl -L -o python-embed.zip \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-embed-amd64.zip"
          unzip -q python-embed.zip -d "$PYTHON_DIR"
          # Enable pip in embedded Python by uncommenting import site
          sed -i 's/#import site/import site/' "$PYTHON_DIR/python311._pth"
          # Install pip
          curl -L -o "$PYTHON_DIR/get-pip.py" https://bootstrap.pypa.io/get-pip.py
          "$PYTHON_DIR/python.exe" "$PYTHON_DIR/get-pip.py" --no-warn-script-location
          # Install RawRefinery
          "$PYTHON_DIR/python.exe" -m pip install rawrefinery --no-warn-script-location
          rm -f "$PYTHON_DIR/get-pip.py"
          echo "RawRefinery bundled successfully."

          echo "Creating GTK settings.ini."
          mkdir -p "$BUILD_DIR/share/gtk-3.0/"
          echo -e '[Settings]\ngtk-button-images=1' > "$BUILD_DIR/share/gtk-3.0/settings.ini"

      - name: Create installer
        if: ${{matrix.build_type == 'release'}}
        working-directory: build/${{matrix.build_type}}
        shell: pwsh
        run: |
          echo "Installing Inno Setup."
          choco install innosetup
          echo "Setup file:"
          type "WindowsInnoSetup.iss"
          echo "Creating installer from script."
          iscc /F"installer" "WindowsInnoSetup.iss"

      - name: Prepare artifact name
        id: prepare-artifact-name
        run: |
          if [ '${{github.ref_type}}' == 'tag' ]; then
            ARTIFACT_NAME_PREFIX="Steep_${REF_NAME_FILTERED}_win64"
          else
            echo "Getting version."
            export VERSION="$(grep -m 1 '^Version: .*$' './build/${{matrix.build_type}}/AboutThisBuild.txt' | sed 's/^Version: \(.\+\)$/\1/')"
            echo "Version is '$VERSION'."
            FILTERED_VERSION="$(echo "$VERSION" | sed 's/[^A-z0-9_.-]//g')"
            ARTIFACT_NAME_PREFIX="Steep_${REF_NAME_FILTERED}_${FILTERED_VERSION}_win64"
          fi
          ARTIFACT_NAME="${ARTIFACT_NAME_PREFIX}_${{matrix.arch}}_${{matrix.build_type}}"
          echo "Artifact name is '$ARTIFACT_NAME'."

          echo "Recording artifact name."
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$(cygpath -u $GITHUB_ENV)"
          echo "Recording version."
          echo "RT_VERSION=$VERSION" >> "$(cygpath -u $GITHUB_ENV)"

          echo "Saving artifact name and filtered ref name to outputs."
          echo "ARTIFACT_NAME_PREFIX=$ARTIFACT_NAME_PREFIX" >> "$(cygpath -u $GITHUB_OUTPUT)"
          echo "REF_NAME_FILTERED=$REF_NAME_FILTERED" >> "$(cygpath -u $GITHUB_OUTPUT)"

          echo "Renaming artifact."
          mv './build/${{matrix.build_type}}' "./build/$ARTIFACT_NAME"
          if [ -e './build/installer.exe' ]; then
            echo "Renaming installer."
            mv './build/installer.exe' "./build/$ARTIFACT_NAME.exe"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: build\${{env.ARTIFACT_NAME}}

      - name: Upload installer
        if: ${{matrix.build_type == 'release'}}
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}.exe
          path: build\${{env.ARTIFACT_NAME}}.exe

  publish:
    needs: build
    runs-on: 'windows-latest'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
        arch: [x86_64, arm64]
    env:
      ARTIFACT_NAME: ${{ format('{0}_{1}_{2}', needs.build.outputs.ARTIFACT_NAME_PREFIX, matrix.arch, matrix.build_type) }}
      REF_NAME_FILTERED: ${{needs.build.outputs.REF_NAME_FILTERED}}
    steps:
      - name: Initialize
        id: initialize
        if: ${{github.ref_type == 'tag' || github.ref_name == 'dev' || (github.event_name == 'pull_request' && contains(fromJSON(env.publish_pre_dev_labels), github.event.pull_request.head.label))}}
        run: |
          echo "Proceeding with job."

      - name: Download build artifact
        id: download-build-artifact
        if: ${{steps.initialize.outcome == 'success'}}
        uses: actions/download-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: build/${{env.ARTIFACT_NAME}}

      - name: Download installer
        id: download-installer
        if: ${{steps.download-build-artifact.outcome == 'success' && matrix.build_type == 'release'}}
        uses: actions/download-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}.exe
          path: build

      - name: Create ZIP archive
        if: ${{steps.download-build-artifact.outcome == 'success'}}
        shell: cmd
        working-directory: ./build
        run: |
          echo "Zipping artifact."
          7z a -tzip "%ARTIFACT_NAME%.zip" "./%ARTIFACT_NAME%"

      - name: Prepare for publishing
        id: prepare-for-publishing
        if: ${{github.ref_type == 'tag' || github.ref_name == 'dev'}}
        run: |
          echo "Setting publish name."
          PUBLISH_NAME="Steep_${REF_NAME_FILTERED}_win64_${{matrix.arch}}_${{matrix.build_type}}"
          echo "Publish name is '$PUBLISH_NAME'."
          if [ "$ARTIFACT_NAME" != "$PUBLISH_NAME" ]; then
            echo "Renaming ZIP file."
            cp "build/$ARTIFACT_NAME.zip" "build/$PUBLISH_NAME.zip"
            if [ -e "./build/$ARTIFACT_NAME.exe" ]; then
              echo "Renaming installer."
              mv "./build/$ARTIFACT_NAME.exe" "./build/$PUBLISH_NAME.exe"
            fi
          fi
          echo "Creating version file."
          cp "build/$ARTIFACT_NAME/AboutThisBuild.txt" "build/$PUBLISH_NAME-AboutThisBuild.txt"

          echo "Recording publish name."
          echo "PUBLISH_NAME=$PUBLISH_NAME" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Publish artifacts
        uses: softprops/action-gh-release@v2
        if: ${{steps.prepare-for-publishing.outcome == 'success'}}
        with:
          tag_name: nightly-github-actions
          files: |
            build/${{env.PUBLISH_NAME}}.zip
            build/${{env.PUBLISH_NAME}}-AboutThisBuild.txt

      - name: Publish installer
        uses: softprops/action-gh-release@v2
        if: ${{steps.prepare-for-publishing.outcome == 'success' && matrix.build_type == 'release'}}
        with:
          tag_name: nightly-github-actions
          files: build/${{env.PUBLISH_NAME}}.exe

      - name: Prepare for publishing pre-dev
        id: prepare-publish-pre-dev
        if: ${{github.event_name == 'pull_request' && contains(fromJSON(env.publish_pre_dev_labels), github.event.pull_request.head.label)}}
        run: |
          echo "Making ref name."
          REF_NAME_FILTERED="$(echo '${{github.event.pull_request.head.label}}' | tr ':' '_' | sed 's/[^A-z0-9_.-]//g')"
          echo "Ref name is '$REF_NAME_FILTERED'."

          echo "Setting publish name."
          PUBLISH_NAME="Steep_${REF_NAME_FILTERED}_win64_${{matrix.arch}}_${{matrix.build_type}}"
          echo "Publish name is '$PUBLISH_NAME'."
          if [ "$ARTIFACT_NAME" != "$PUBLISH_NAME" ]; then
            echo "Renaming ZIP file."
            cp "build/$ARTIFACT_NAME.zip" "build/$PUBLISH_NAME.zip"
            if [ -e "./build/$ARTIFACT_NAME.exe" ]; then
              echo "Renaming installer."
              mv "./build/$ARTIFACT_NAME.exe" "./build/$PUBLISH_NAME.exe"
            fi
          fi
          echo "Creating version file."
          cp "build/$ARTIFACT_NAME/AboutThisBuild.txt" "build/$PUBLISH_NAME-AboutThisBuild.txt"

          echo "Recording publish name."
          echo "PUBLISH_NAME=$PUBLISH_NAME" >> "$(cygpath -u $GITHUB_ENV)"

      - name: Publish pre-dev artifacts
        uses: softprops/action-gh-release@v2
        if: ${{steps.prepare-publish-pre-dev.outcome == 'success'}}
        with:
          tag_name: pre-dev-github-actions
          repository: cheetohsum/Steep
          files: |
            build/${{env.PUBLISH_NAME}}.zip
            build/${{env.PUBLISH_NAME}}-AboutThisBuild.txt

      - name: Publish pre-dev installer
        uses: softprops/action-gh-release@v2
        if: ${{steps.prepare-publish-pre-dev.outcome == 'success' && matrix.build_type == 'release'}}
        with:
          tag_name: pre-dev-github-actions
          repository: cheetohsum/Steep
          files: build/${{env.PUBLISH_NAME}}.exe

  test-launch:
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build_type: [release, debug]
        arch: [x86_64, arm64]
    env:
      ARTIFACT_NAME: ${{ format('{0}_{1}_{2}', needs.build.outputs.ARTIFACT_NAME_PREFIX, matrix.arch, matrix.build_type) }}
    steps:
      - name: Download build artifact
        id: download-build-artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: build/${{env.ARTIFACT_NAME}}

      - name: Launch CLI
        working-directory: build/${{env.ARTIFACT_NAME}}
        run: |
          echo "Launching CLI."
          ./rawtherapee-cli.exe

      - name: Launch GUI
        working-directory: build/${{env.ARTIFACT_NAME}}
        run: |
          STATUS_FILE="rawtherapee-status.txt"
          SUCCESS_MESSAGE="success"
          FAILURE_MESSAGE="failure"

          echo "Launching GUI."
          ./rawtherapee.exe && echo $SUCCESS_MESSAGE > $STATUS_FILE || echo $FAILURE_MESSAGE > $STATUS_FILE &

          echo "Waiting 10 seconds for app to start."
          sleep 10

          echo "Checking if app launched successfully."
          if [ -f "$STATUS_FILE" ]; then
            $STATUS=$(cat "$STATUS_FILE")
            if [ "$STATUS" == "$FAILURE_MESSAGE" ]; then
              echo "App failed to start."
              exit 1
            elif [ "$STATUS" == "$SUCCESS_MESSAGE" ]; then
              echo "App started successfully."
            else
              echo "Unknown status: $STATUS"
              exit 1
            fi
          fi
          echo "App is launching or has launched successfully."
