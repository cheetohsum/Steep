<?xml version="1.0" encoding="UTF-8"?>
<svg width="160mm" height="100mm" viewBox="0 0 160 100" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <title>Steep splash screen</title>
  <defs>
    <radialGradient id="glow" cx="80" cy="38" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a5a7a" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#1a3a5a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#141724" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f30"/>
      <stop offset="1" stop-color="#141724"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e4ec"/>
      <stop offset="1" stop-color="#a0a8b8"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#dce0e8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ccd4"/>
      <stop offset="1" stop-color="#8890a0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.25" fill="#2a3a50" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="160" height="100" fill="url(#bgGrad)"/>

  <!-- Grid dots -->
  <rect width="160" height="100" fill="url(#dots)"/>

  <!-- Topographic contour lines -->
  <g fill="none" stroke-width="0.3" opacity="0.2">
    <path d="M0,12 Q30,9 60,11 Q90,14 120,10 Q140,8 160,11" stroke="#1a5a7a"/>
    <path d="M0,20 Q25,17 55,19 Q85,22 115,18 Q140,16 160,19" stroke="#1a6a8a"/>
    <path d="M0,76 Q35,73 65,75 Q95,78 125,74 Q145,72 160,75" stroke="#1e6e8e"/>
    <path d="M0,82 Q30,79 60,81 Q90,84 120,80 Q143,78 160,81" stroke="#1a7898"/>
    <path d="M0,88 Q25,86 55,87 Q85,90 115,86 Q140,84 160,87" stroke="#1a6a8a"/>
    <path d="M0,94 Q35,92 65,93 Q95,96 125,92 Q148,90 160,93" stroke="#1a5a7a"/>
  </g>

  <!-- Concentric contour rings around logo -->
  <g fill="none" stroke-width="0.3" opacity="0.18">
    <ellipse cx="80" cy="38" rx="42" ry="28" stroke="#1a6a8a"/>
    <ellipse cx="80" cy="38" rx="35" ry="23" stroke="#2080a0"/>
    <ellipse cx="80" cy="38" rx="28" ry="18" stroke="#2a8aaa"/>
    <ellipse cx="80" cy="38" rx="38" ry="25" stroke="#1a7090" stroke-dasharray="2,4"/>
  </g>

  <!-- Central radial glow -->
  <rect width="160" height="100" fill="url(#glow)"/>

  <!-- Steep logo (mountain through lens) centered at y=35 -->
  <g transform="translate(80,35)">
    <!-- Lens background -->
    <circle cx="0" cy="0" r="18" fill="#1a2030"/>
    <!-- Outer lens ring -->
    <circle cx="0" cy="0" r="16.5" fill="none" stroke="url(#ringGrad)" stroke-width="1.5"/>
    <!-- Inner ring accent -->
    <circle cx="0" cy="0" r="15.2" fill="none" stroke="#3a4a60" stroke-width="0.25" opacity="0.5"/>
    <!-- Mountain silhouette -->
    <path d="M-12,9 L-2,-11 L2.5,-0.5 L8,-14.5 L18,9 Z" fill="url(#mountainGrad)"/>
    <!-- Snow cap - taller peak -->
    <path d="M8,-14.5 L4.5,-7 L8,-10 L11.5,-7 Z" fill="url(#snowGrad)"/>
    <!-- Snow cap - shorter peak -->
    <path d="M-2,-11 L-4,-7 L-2,-8.5 L0,-7 Z" fill="url(#snowGrad)" opacity="0.7"/>
  </g>

  <!-- "S T E E P" text -->
  <text x="80" y="65" text-anchor="middle" fill="#c0c6d4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="7" letter-spacing="3" font-weight="300">S T E E P</text>

  <!-- "Photo Editor" subtitle -->
  <text x="80" y="72" text-anchor="middle" fill="#5a6478" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="3.2" letter-spacing="1.5" font-weight="300">Photo Editor</text>
</svg>
