<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Left half (darker/before) -->
  <rect x="1.5" y="2" width="5.5" height="12" rx="1" ry="1"
        fill="#8890a0" fill-opacity="0.25" stroke="#b0b8c4" stroke-width="1.2"/>
  <!-- Right half (lighter/after) -->
  <rect x="9" y="2" width="5.5" height="12" rx="1" ry="1"
        fill="none" stroke="#b0b8c4" stroke-width="1.2"/>
  <!-- Center divider line -->
  <line x1="8" y1="3" x2="8" y2="13" stroke="#b0b8c4" stroke-width="1.3"
        stroke-linecap="round"/>
  <!-- Left/right arrows on divider -->
  <polyline points="6.5,7 5.2,8 6.5,9" fill="none" stroke="#b0b8c4"
            stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="9.5,7 10.8,8 9.5,9" fill="none" stroke="#b0b8c4"
            stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
