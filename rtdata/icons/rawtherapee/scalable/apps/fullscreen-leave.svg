<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Restore down: two overlapping rectangles like Windows 11 -->
  <!-- Back rectangle (offset up-right) -->
  <rect x="7" y="3" width="14" height="14" rx="1"
    style="opacity:0.5;fill:none;stroke:#cccccc;stroke-width:1.5;stroke-linejoin:round"/>
  <!-- Front rectangle (offset down-left) -->
  <rect x="3" y="7" width="14" height="14" rx="1"
    style="opacity:0.85;fill:#1e1e1e;stroke:#cccccc;stroke-width:1.5;stroke-linejoin:round"/>
</svg>
