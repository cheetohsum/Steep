<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Pencil draw icon -->
  <!-- Pencil body (tilted) -->
  <path d="M11.5,1.5 L14,4 L5.5,12.5 L3,10 Z"
    style="opacity:0.8;fill:#cccccc;stroke:none"/>
  <!-- Pencil tip -->
  <path d="M3,10 L1.5,14.5 L5.5,12.5 Z"
    style="opacity:0.7;fill:#cccccc;stroke:none"/>
  <!-- Pencil top edge (eraser) -->
  <line x1="11.5" y1="1.5" x2="14" y2="4"
    style="opacity:0.9;stroke:#999999;stroke-width:1.2;stroke-linecap:round"/>
  <!-- Pencil center line -->
  <line x1="7" y1="6" x2="12" y2="3"
    style="opacity:0.4;stroke:#999999;stroke-width:0.6;stroke-linecap:round"/>
</svg>
