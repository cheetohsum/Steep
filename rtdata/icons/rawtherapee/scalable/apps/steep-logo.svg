<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Steep logo: a peak seen through a lens, its summit breaking out of the ring -->
  <defs>
    <!-- Gap in the ring where the summit passes through it -->
    <mask id="ring-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M12.3 7.5 L14.5 1.5 L16.7 7.5 Z" fill="#000" stroke="#000" stroke-width="2.1" stroke-linejoin="round"/>
    </mask>
    <!-- Snowline cut across the summit -->
    <mask id="snowline" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M12.7 6.6 L14.15 5.3 L14.95 6.35 L16.4 5.2" fill="none" stroke="#000" stroke-width="0.85" stroke-linejoin="round" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="12" cy="12" r="9.5" fill="none" stroke="#cccccc" stroke-opacity="0.9" stroke-width="1.5" mask="url(#ring-gap)"/>
  <path d="M5 17 L9.75 9.25 L11.6 12 L14.5 1.5 L19 17 Z" fill="#cccccc" fill-opacity="0.9" stroke="#cccccc" stroke-opacity="0.9" stroke-width="0.3" stroke-linejoin="round" mask="url(#snowline)"/>
</svg>
