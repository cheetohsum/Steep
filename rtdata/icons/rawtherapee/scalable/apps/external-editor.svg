<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Document/canvas -->
  <rect x="1.5" y="3" width="9" height="11" rx="1.2" ry="1.2"
        fill="none" stroke="#b0b8c4" stroke-width="1.3"/>
  <!-- Pencil body (diagonal, pointing upper-right) -->
  <line x1="7.5" y1="9.5" x2="13" y2="4" stroke="#b0b8c4" stroke-width="1.4"
        stroke-linecap="round"/>
  <!-- Pencil tip -->
  <line x1="13" y1="4" x2="14.2" y2="2.8" stroke="#b0b8c4" stroke-width="1.4"
        stroke-linecap="round"/>
  <!-- Pencil nib (small triangle feel) -->
  <circle cx="14.2" cy="2.8" r="0.5" fill="#b0b8c4"/>
  <!-- Small edit line on pencil -->
  <line x1="12" y1="3.2" x2="11.2" y2="4" stroke="#b0b8c4" stroke-width="0.8"
        stroke-linecap="round"/>
</svg>
