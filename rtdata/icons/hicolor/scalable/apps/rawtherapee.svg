<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <title>Steep Logo</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3040"/>
      <stop offset="1" stop-color="#1a1e28"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e4ec"/>
      <stop offset="1" stop-color="#a0a8b8"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#dce0e8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ccd4"/>
      <stop offset="1" stop-color="#8890a0"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bgGrad)"/>
  <!-- Outer lens ring -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="url(#ringGrad)" stroke-width="10"/>
  <!-- Mountain silhouette -->
  <path d="M48 200 L108 72 L138 120 L168 56 L228 200 Z" fill="url(#mountainGrad)"/>
  <!-- Snow cap on taller peak -->
  <path d="M168 56 L148 104 L168 90 L188 104 Z" fill="url(#snowGrad)"/>
  <!-- Snow cap on shorter peak -->
  <path d="M108 72 L98 96 L108 88 L118 96 Z" fill="url(#snowGrad)" opacity="0.7"/>
</svg>
