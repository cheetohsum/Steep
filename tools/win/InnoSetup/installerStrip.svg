<?xml version="1.0" encoding="UTF-8"?>
<svg width="164" height="314" viewBox="0 0 164 314" xmlns="http://www.w3.org/2000/svg">
  <title>Steep Installer Banner</title>
  <defs>
    <radialGradient id="glow" cx="82" cy="140" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a5a7a" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#1a3a5a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#141724" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f30"/>
      <stop offset="1" stop-color="#141724"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e4ec"/>
      <stop offset="1" stop-color="#a0a8b8"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#dce0e8"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ccd4"/>
      <stop offset="1" stop-color="#8890a0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.6" fill="#2a3a50" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="164" height="314" fill="url(#bgGrad)"/>

  <!-- Grid dots -->
  <rect width="164" height="314" fill="url(#dots)"/>

  <!-- Topographic contour lines -->
  <g fill="none" stroke-width="0.6" opacity="0.25">
    <path d="M0,30 Q30,24 60,28 Q90,32 120,26 Q145,22 164,27" stroke="#1a5a7a"/>
    <path d="M0,50 Q35,44 70,48 Q100,53 130,46 Q150,42 164,47" stroke="#1a6a8a"/>
    <path d="M0,70 Q25,64 55,68 Q85,73 115,66 Q140,62 164,67" stroke="#1e6e8e"/>
    <path d="M0,90 Q40,84 75,89 Q105,94 135,87 Q152,83 164,88" stroke="#1a7898"/>
    <path d="M0,220 Q30,214 65,218 Q95,223 125,216 Q148,212 164,217" stroke="#1a7898"/>
    <path d="M0,240 Q35,234 70,238 Q100,243 130,236 Q150,232 164,237" stroke="#1e6e8e"/>
    <path d="M0,258 Q25,252 60,256 Q90,261 120,254 Q145,250 164,255" stroke="#1a6a8a"/>
    <path d="M0,275 Q40,269 75,273 Q105,278 135,271 Q152,267 164,272" stroke="#1a5a7a"/>
    <path d="M0,290 Q30,285 60,288 Q90,292 120,286 Q145,282 164,287" stroke="#1a4a6a"/>
  </g>

  <!-- Concentric contour rings around logo -->
  <g fill="none" stroke-width="0.5" opacity="0.2">
    <ellipse cx="82" cy="140" rx="70" ry="65" stroke="#1a6a8a"/>
    <ellipse cx="82" cy="140" rx="58" ry="53" stroke="#2080a0"/>
    <ellipse cx="82" cy="140" rx="48" ry="43" stroke="#2a8aaa"/>
    <ellipse cx="82" cy="140" rx="56" ry="50" stroke="#1a7090" stroke-dasharray="3,6"/>
  </g>

  <!-- Central radial glow -->
  <rect width="164" height="314" fill="url(#glow)"/>

  <!-- Steep logo (mountain through lens) centered at y=140 -->
  <g transform="translate(82,140)">
    <!-- Lens background -->
    <circle cx="0" cy="0" r="37" fill="#1a2030"/>
    <!-- Outer lens ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#ringGrad)" stroke-width="3"/>
    <!-- Inner ring accent -->
    <circle cx="0" cy="0" r="31.5" fill="none" stroke="#3a4a60" stroke-width="0.5" opacity="0.5"/>
    <!-- Mountain silhouette -->
    <path d="M-25,19 L-4,-23 L5,-1 L16,-30 L37,19 Z" fill="url(#mountainGrad)"/>
    <!-- Snow cap - taller peak -->
    <path d="M16,-30 L9,-14 L16,-20 L23,-14 Z" fill="url(#snowGrad)"/>
    <!-- Snow cap - shorter peak -->
    <path d="M-4,-23 L-8,-14 L-4,-17 L0,-14 Z" fill="url(#snowGrad)" opacity="0.7"/>
  </g>

  <!-- "S T E E P" text -->
  <text x="82" y="202" text-anchor="middle" fill="#c0c6d4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="6" font-weight="300">S T E E P</text>

  <!-- Subtle tagline -->
  <text x="82" y="218" text-anchor="middle" fill="#5a6478" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="7" letter-spacing="2" font-weight="300">PHOTO EDITOR</text>
</svg>
